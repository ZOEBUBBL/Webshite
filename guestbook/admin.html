<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Guestbook admin</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:24px 16px;background:#07090d;color:#d9e1ea;font:14px/1.5 Verdana,sans-serif}
main{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}p{color:#8796a8;margin:0 0 16px}
form{display:flex;gap:8px;margin-bottom:16px}
input{flex:1;font:16px Verdana,sans-serif;padding:8px;background:#000;color:#d9e1ea;border:1px solid #3c4c61;border-radius:3px}
button{font:bold 13px Verdana,sans-serif;padding:8px 14px;background:#151d29;color:#5ee6d0;border:1px solid #5ee6d0;border-radius:3px;cursor:pointer;min-height:40px}
.e{display:flex;gap:12px;align-items:flex-start;background:#0c1118;border:1px solid #2a3646;border-radius:3px;padding:10px;margin-bottom:8px;overflow-wrap:anywhere}
.e div{flex:1}.e b{color:#cfc8ff}.e small{color:#8796a8}
.e button{color:#ff5d73;border-color:#ff5d73}
#msg{color:#d8b45a}
</style>
</head>
<body>
<main>
  <h1>Guestbook admin</h1>
  <p id="msg">Enter your ADMIN_TOKEN to see and delete entries.</p>
  <form id="f"><input id="tok" type="password" placeholder="admin password" autocomplete="current-password" aria-label="Admin password"><button>Unlock</button></form>
  <div id="list"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let tok = sessionStorage.getItem('gb_tok') || '';
const call = (u, o = {}) => fetch(u, {...o, headers: {Authorization: 'Bearer ' + tok}}).then(async r => {
  const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j; });
const draw = d => {
  $('msg').textContent = `${d.entries.length} entries · ${d.hits ?? '?'} visits`;
  $('list').innerHTML = d.entries.slice().reverse().map(e => `<div class="e"><div><b>${esc(e.n)}</b> <small>· ${new Date(e.t).toLocaleString()}</small><br>${esc(e.m)}</div>
    <button data-id="${esc(e.id)}">Delete</button></div>`).join('');
};
const load = () => call('/api/admin').then(draw).catch(e => { $('msg').textContent = e.message; });
$('f').addEventListener('submit', ev => { ev.preventDefault(); tok = $('tok').value; sessionStorage.setItem('gb_tok', tok); load(); });
$('list').addEventListener('click', ev => {
  const b = ev.target.closest('button[data-id]'); if (!b || !confirm('Delete this entry?')) return;
  call('/api/guestbook/' + b.dataset.id, {method: 'DELETE'}).then(load).catch(e => { $('msg').textContent = e.message; });
});
if (tok) load();
</script>
</body>
</html>
